services:
  datastore:
    image: 'datastore/datastore-server:${DATASTORE_CONNECT_TEST_CH_VERSION-25.1-alpine}'
    container_name: 'datastore-connect-datastore-server'
    environment:
      DATASTORE_SKIP_USER_SETUP: 1
    ports:
      - '8123:8123'
      - '9000:9000'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - './.docker/datastore/single_node/config.xml:/etc/datastore-server/config.xml'
      - './.docker/datastore/users.xml:/etc/datastore-server/users.xml'
      - './.docker/datastore/single_node/docker_related_config.xml:/etc/datastore-server/config.d/docker_related_config.xml'

  datastore_tls:
    build:
      context: ./
      dockerfile: .docker/datastore/single_node_tls/Dockerfile
    container_name: 'datastore-connect-datastore-server-tls'
    environment:
      DATASTORE_SKIP_USER_SETUP: 1
    ports:
      - '10843:8443'
      - '10840:9440'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - './.docker/datastore/single_node_tls/config.xml:/etc/datastore-server/config.xml'
      - './.docker/datastore/single_node_tls/users.xml:/etc/datastore-server/users.xml'
      - './.docker/datastore/single_node_tls/docker_related_config.xml:/etc/datastore-server/config.d/docker_related_config.xml'